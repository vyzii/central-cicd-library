name: Library CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Workflow validation
    runs-on: ubuntu-latest

    permissions:
      contents: read # Required for checkout to read repo contents
      checks: write # Required for reviewdog's github-check reporter

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Prettier format check
        run: npx prettier@3.9.9 --yes --check ".github/workflows/**/*.{yml,yaml}"

      - name: Actionlint validation
        if: ${{ !cancelled() && success() || !cancelled() && failure() }}
        uses: reviewdog/action-actionlint@1758727be30241166609dad4c97588b6ad411f32 # v1.79.1
        with:
          github_token: ${{ github.token }}
          reporter: github-check
          tool_name: actionlint
          level: error
          filter_mode: nofilter
          fail_level: any

  security:
    name: Workflow security
    runs-on: ubuntu-latest

    permissions:
      contents: read # Required for checkout to read repo contents
      security-events: write # Required for reviewdog's github-check reporter

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check workflow security
        if: ${{ !cancelled() && success() || !cancelled() && failure() }}
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          inputs: .github/workflows
          version: "1.30.1"
          advanced-security: true
          annotations: false
          online-audits: true
