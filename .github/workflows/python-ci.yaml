name: Reusable Python CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory containing the Python project."
        type: string
        default: "."
      python-version:
        description: "Python version to install. Overrides python-version-file."
        type: string
        default: ""
      python-version-file:
        description: "Python version file. Defaults to <working-directory>/.python-version when no version is provided."
        type: string
        default: ""
      dependency-group:
        description: "uv dependency group in pyproject.toml containing pytest and its plugins."
        type: string
        default: "test"
      pytest-args:
        description: "Extra arguments passed to pytest."
        type: string
        default: ""
      ruff-version:
        description: "Pinned Ruff version."
        type: string
        default: "0.16.8"
      bandit-version:
        description: "Pinned Bandit version."
        type: string
        default: "1.9.4"
      trivy-severity:
        description: "Comma-separated severities that cause Trivy to fail."
        type: string
        default: "CRITICAL,HIGH"
      upload-artifact:
        description: "Upload text and SARIF security reports as workflow artifacts."
        type: boolean
        default: true
      upload-sarif:
        description: "Upload Bandit and Trivy SARIF to code scanning when available."
        type: boolean
        default: true
      output-summary:
        description: "Write human-readable Bandit and Trivy results to the job summary."
        type: boolean
        default: true
      retention-days:
        description: "Days to retain uploaded security reports."
        type: number
        default: 30

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    uses: vyzii/central-cicd-library/.github/workflows/python-lint.yaml
    with:
      working-directory: ${{ inputs.working-directory }}
      ruff-version: ${{ inputs.ruff-version }}

  test:
    uses: vyzii/central-cicd-library/.github/workflows/python-test.yaml
    with:
      working-directory: ${{ inputs.working-directory }}
      python-version: ${{ inputs.python-version }}
      python-version-file: ${{ inputs.python-version-file }}
      dependency-group: ${{ inputs.dependency-group }}
      pytest-args: ${{ inputs.pytest-args }}

  bandit:
    uses: vyzii/central-cicd-library/.github/workflows/python-bandit.yaml
    with:
      working-directory: ${{ inputs.working-directory }}
      python-version: ${{ inputs.python-version }}
      python-version-file: ${{ inputs.python-version-file }}
      bandit-version: ${{ inputs.bandit-version }}
      upload-artifact: ${{ inputs.upload-artifact }}
      upload-sarif: ${{ inputs.upload-sarif }}
      output-summary: ${{ inputs.output-summary }}
      retention-days: ${{ inputs.retention-days }}

  trivy:
    uses: vyzii/central-cicd-library/.github/workflows/python-trivy.yaml
    with:
      scan-ref: ${{ inputs.working-directory }}
      severity: ${{ inputs.trivy-severity }}
      upload-artifact: ${{ inputs.upload-artifact }}
      upload-sarif: ${{ inputs.upload-sarif }}
      output-summary: ${{ inputs.output-summary }}
      retention-days: ${{ inputs.retention-days }}
