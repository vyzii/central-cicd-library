name: Python Test

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory containing the Python project."
        type: string
        default: "."
      python-version:
        description: "Python version to install. Overrides python-version-file."
        type: string
        default: ""
      python-version-file:
        description: "Python version file. Defaults to <working-directory>/.python-version when no version is provided."
        type: string
        default: ""
      dependency-group:
        description: "uv dependency group in pyproject.toml containing pytest (and plugins)."
        type: string
        default: "test"
      pytest-args:
        description: "Extra arguments to be passed to pytest."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve Python version
        id: python
        shell: bash
        run: |
          version="${{ inputs.python-version }}"
          file="${{ inputs.python-version-file }}"

          if [[ -z "$version" ]]; then
            if [[ -z "$file" ]]; then
              file="${{ inputs.working-directory }}/.python-version"
            fi

            if [[ "$file" = /* ]]; then
              resolved_file="$file"
            else
              resolved_file="$GITHUB_WORKSPACE/$file"
            fi

            if [[ ! -f "$resolved_file" ]]; then
              echo "::error::Resolved python-version-file '$file' does not exist. Set python-version, add that file, or point python-version-file at one that exists."
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python.outputs.version }}
          python-version-file: ${{ steps.python.outputs.file }}

      - name: Sync project
        run: uv sync --locked --group ${{ inputs.dependency-group }}

      - name: Run pytest
        run: uv run pytest ${{ inputs.pytest-args }}
