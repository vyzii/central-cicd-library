name: Python Test

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory containing the Python project."
        type: string
        default: "."
      python-version:
        description: "Python version to install. Overrides python-version-file."
        type: string
        default: ""
      python-version-file:
        description: "Python version file. Defaults to <working-directory>/.python-version when no version is provided."
        type: string
        default: ""
      dependency-group:
        description: "uv dependency group in pyproject.toml containing pytest (and plugins)."
        type: string
        default: "test"
      pytest-args:
        description: "JSON array of arguments to be passed to pytest."
        type: string
        default: "[]"

permissions: {}

env:
  INPUTS_WORKING_DIRECTORY: ${{ inputs.working-directory }}
  INPUTS_PYTHON_VERSION: ${{ inputs.python-version }}
  INPUTS_PYTHON_VERSION_FILE: ${{ inputs.python-version-file }}
  INPUTS_DEPENDENCY_GROUP: ${{ inputs.dependency-group }}
  INPUTS_PYTEST_ARGS: ${{ inputs.pytest-args }}

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest

    permissions:
      contents: read # Required for checkout to read repo contents

    defaults:
      run:
        working-directory: ${{ env.INPUTS_WORKING_DIRECTORY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Python version
        id: python
        shell: bash
        run: |
          version="${INPUTS_PYTHON_VERSION}"
          file="${INPUTS_PYTHON_VERSION_FILE}"

          if [[ -z "$version" ]]; then
            if [[ -z "$file" ]]; then
              file="${INPUTS_WORKING_DIRECTORY}/.python-version"
            fi

            if [[ "$file" = /* ]]; then
              resolved_file="$file"
            else
              resolved_file="$GITHUB_WORKSPACE/$file"
            fi

            if [[ ! -f "$resolved_file" ]]; then
              echo "::error::Resolved python-version-file '$file' does not exist. Set python-version, add that file, or point python-version-file at one that exists."
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ steps.python.outputs.version }}
          python-version-file: ${{ steps.python.outputs.file }}

      - name: Sync project
        run: uv sync --locked --group "$INPUTS_DEPENDENCY_GROUP"

      - name: Run pytest
        run: |
          mapfile -t pytest_args < <(jq -er '.[] | strings' <<< "$PYTEST_ARGS_JSON")
          uv run pytest "${pytest_args[@]}"
