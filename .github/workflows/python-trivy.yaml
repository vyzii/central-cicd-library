name: Trivy Filesystem Scan

on:
  workflow_call:
    inputs:
      scan-ref:
        description: "Repository-relative filesystem path for Trivy to scan."
        type: string
        default: "."
      severity:
        description: "Comma-separated severities that cause Trivy to fail."
        type: string
        default: "CRITICAL,HIGH"
      upload-artifact:
        description: "Upload text and SARIF reports as a workflow artifact."
        type: boolean
        default: true
      upload-sarif:
        description: "Upload SARIF to code scanning when available."
        type: boolean
        default: true
      output-summary:
        description: "Write human-readable results to the job summary."
        type: boolean
        default: true
      retention-days:
        description: "Days to retain uploaded reports."
        type: number
        default: 30

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy dependency scan
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-ref }}
          scanners: vuln
          format: json
          output: trivy-results.json
          severity: ${{ inputs.severity }}
          exit-code: "1"
          ignore-unfixed: true

      - name: Convert Trivy output to SARIF
        if: inputs.upload-sarif == true || inputs.upload-artifact == true
        run: trivy convert --format sarif --output trivy-results.sarif trivy-results.json

      - name: Convert Trivy output to text
        if: inputs.output-summary == true || inputs.upload-artifact == true
        run: trivy convert --format table trivy-results.json > trivy-results.txt

      - name: Upload Trivy SARIF
        if: inputs.upload-sarif == true
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-SCA-${{ inputs.scan-ref }}

      - name: Add Trivy results to job summary
        if: inputs.output-summary == true
        run: |
          if [[ -s trivy-results.txt ]]; then
            {
              echo "### Trivy dependency scan - ${{ inputs.scan-ref }}"
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```'
              cat trivy-results.txt
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Flatten artifact name path
        id: artifact-name
        shell: bash
        run: echo "name=trivy-reports-$(echo '${{ inputs.scan-ref }}' | tr '/.' '--')" >> "$GITHUB_OUTPUT"

      - name: Upload Trivy report artifacts
        if: inputs.upload-artifact == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: |
            trivy-results.sarif
            trivy-results.txt
          if-no-files-found: warn
          retention-days: ${{ inputs.retention-days }}

      - name: Fail if Trivy found issues
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::Trivy dependency scan reported findings. Review the generated reports for details."
          exit 1
