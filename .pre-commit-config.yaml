minimum_pre_commit_version: "3.0.0"
default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: prettier
        name: Check workflow formatting
        language: node
        entry: prettier
        additional_dependencies: ["prettier@3.9.9"]
        args: [--check]
        files: ^\.github/workflows/[^/]+\.ya?ml$
        types: [yaml]

      - id: actionlint
        name: Validate workflows and inline scripts
        language: python
        entry: actionlint
        additional_dependencies:
          - actionlint-py==1.7.12.25
          - shellcheck-py==0.11.0.1
          - pyflakes==4.0.2
        files: ^\.github/workflows/[^/]+\.ya?ml$
        types: [yaml]

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks:
      - id: zizmor
        files: ^\.github/workflows/[^/]+\.ya?ml$
        args: [--no-progress, --strict-collection]
